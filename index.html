<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Bubble</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
    <style>
        @font-face {
            font-family: "Grape Squishy";
            src: url("https://fonts.cdnfonts.com/s/155838/GrapeSquishy-G3GrA.woff") format("woff");
        }
        body {
            background: #000;
            color: #fff;
            font-family: "Grape Squishy", sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 20px;
        }
        canvas {
            background: #000;
            cursor: pointer;
            display: block;
            margin: auto;
        }
        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading"><div class="spinner"></div></div>

    <h1>Gravity Bubble</h1>

    <canvas id="canvas" width="600" height="500"></canvas>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js");
        }
    </script>

    <script type="py-game" src="game.py" target="canvas" config="pyscript.json"></script>
</body>
</html>
